<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Completo — JavaScript, React e Flexbox</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#65708a;--primary:#5b5bd6;--primary-dark:#4141a9;--correct:#16834b;--correct-bg:#e9f8ef;--wrong:#c93636;--wrong-bg:#fff0f0;--border:#dce2ee;--shadow:0 10px 30px rgba(34,45,75,.10)}
body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef2ff,var(--bg));color:var(--text);min-height:100vh;line-height:1.5}
.container{width:min(1000px,94%);margin:0 auto;padding:30px 0 60px}
header{background:var(--card);border-radius:20px;padding:28px;box-shadow:var(--shadow);margin-bottom:22px}
header h1{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:8px}
header p{color:var(--muted)}
.top-info{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-top:20px}
.progress-area{flex:1;min-width:220px}
.progress-bar{height:12px;background:#e5e9f2;border-radius:99px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#8a7cff);transition:width .35s ease}
.score{background:#f0f0ff;color:var(--primary-dark);padding:10px 15px;border-radius:12px;font-weight:bold;white-space:nowrap}
.question-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:26px;margin-bottom:20px}
.category{display:inline-block;padding:6px 10px;background:#eeeeff;color:var(--primary-dark);border-radius:99px;font-size:.82rem;font-weight:bold;margin-bottom:12px}
.question{font-size:1.15rem;font-weight:bold;margin-bottom:18px}
.answers{display:flex;flex-direction:column;gap:12px}
.answer{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:2px solid var(--border);background:#fff;color:var(--text);padding:14px;border-radius:14px;cursor:pointer;font-size:1rem;transition:.2s ease}
.answer:hover:not(.disabled){transform:translateY(-2px);border-color:var(--primary)}
.letter{flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#edf0f7;font-weight:bold}
.answer-text{flex:1}
.answer.correct{border-color:var(--correct);background:var(--correct-bg)}
.answer.correct .letter{background:var(--correct);color:#fff}
.answer.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.answer.wrong .letter{background:var(--wrong);color:#fff}
.answer.disabled{cursor:default}
.status{font-weight:bold;margin-left:auto;white-space:nowrap}
.correct .status{color:var(--correct)}
.wrong .status{color:var(--wrong)}
.explanation{display:none;margin-top:7px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.75);color:#47516a;font-size:.92rem;border-left:4px solid #aeb6c9}
.answer.show-explanation .explanation{display:block}
.answer.correct .explanation{border-left-color:var(--correct)}
.answer.wrong .explanation{border-left-color:var(--wrong)}
.feedback{display:none;margin-top:18px;padding:15px;border-radius:14px;font-weight:bold}
.feedback.show{display:block}
.feedback.good{background:var(--correct-bg);color:var(--correct)}
.feedback.bad{background:var(--wrong-bg);color:var(--wrong)}
.actions{margin-top:18px}
button.action{border:0;border-radius:12px;padding:12px 18px;font-size:1rem;font-weight:bold;cursor:pointer;background:var(--primary);color:#fff;margin:4px}
button.action:hover{background:var(--primary-dark)}
button.action.secondary{background:#e8ebf3;color:var(--text)}
button.action:disabled{opacity:.5;cursor:not-allowed}
#result{display:none;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:32px;text-align:center}
#result.show{display:block}
.final-score{font-size:3rem;color:var(--primary);font-weight:bold;margin:12px 0}
footer{text-align:center;color:var(--muted);margin-top:20px;font-size:.9rem}
@media(max-width:650px){header,.question-card,#result{padding:18px}.status{display:none}}

.understand{display:none;margin-top:8px;padding:6px 12px;border-radius:99px;background:#fff;border:2px solid var(--primary);color:var(--primary-dark);font-size:.85rem;font-weight:bold;cursor:pointer}
.answer.show-explanation .understand{display:inline-block}
.understand:hover{background:var(--primary);color:#fff}
#modal{display:none;position:fixed;inset:0;background:rgba(23,32,51,.55);z-index:50;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.modal-box{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-box h3{margin:8px 0;font-size:1.05rem}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:bold}
.badge.ok{background:var(--correct-bg);color:var(--correct)}
.badge.no{background:var(--wrong-bg);color:var(--wrong)}
.modal-box p{margin:8px 0;color:#37415a}
.modal-box .lbl{font-weight:bold;color:var(--primary-dark);margin-top:14px}
.modal-box pre{background:#1e2233;color:#e6e9f5;padding:12px;border-radius:10px;overflow-x:auto;font-size:.85rem;line-height:1.5;margin-top:6px}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 Quiz Completo — JavaScript, React e Flexbox</h1>
    <p><span id="total">92</span> questões: JS puro × React, JSX, useState, funções, Vite, calculadora, CSS e Display Flex. Escolha um tema ou faça tudo.</p>
    <div class="top-info" style="margin-top:16px">
      <select id="filter" style="padding:10px;border-radius:10px;border:2px solid var(--border);font-size:1rem"></select>
      <label style="display:flex;align-items:center;gap:6px;color:var(--muted)"><input type="checkbox" id="shuffle"> Embaralhar ordem</label>
      <span class="score" id="savedInfo"></span>
      <button class="action secondary" style="padding:8px 12px;font-size:.85rem" onclick="clearSaved()">🗑️ Limpar erros salvos</button>
    </div>
    <div class="top-info">
      <div class="progress-area">
        <strong id="progressText"></strong>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="score" id="scoreText">Acertos: 0</div>
    </div>
  </header>

  <main id="quiz"></main>

  <section id="result">
    <h2>🎉 Fim da rodada!</h2>
    <div class="final-score" id="finalScore"></div>
    <p id="finalMessage"></p>
    <div style="margin-top:20px">
      <button class="action" id="retryWrong" onclick="startRound(wrongList)">🎯 Refazer só as que errei</button>
      <button class="action secondary" onclick="startFromFilter()">🔄 Refazer este tema</button>
    </div>
  </section>

  <footer>Clique em uma alternativa e depois em “💡 Entender” para abrir uma explicação com exemplo.</footer>
</div>

<div id="modal"><div class="modal-box" id="modalBox"></div></div>

const questions = [{"c": "JavaScript puro × React", "q": "No JavaScript puro, como o script original pegava um elemento da página para manipulá-lo?", "o": ["document.getElementById(\"btnSaudacao\")", "useState(\"btnSaudacao\")", "<button id=\"btnSaudacao\">", "React.createElement(\"button\")"], "a": 0, "e": ["Correto. getElementById procura no DOM o elemento que possui aquele id.", "useState é um Hook do React usado para criar e atualizar estado; não é usado para localizar elementos do DOM.", "Isso é uma tag HTML, não um comando JavaScript para obter um elemento já existente.", "React.createElement cria elementos React; não é a forma usada pelo JavaScript puro para selecionar um elemento existente."], "g": "JS puro × React", "d": ["O DOM é a “árvore” de elementos da página. No JS puro você precisa buscar o elemento na árvore antes de mexer nele. O getElementById faz essa busca pelo id do HTML e devolve o elemento.", "const btn = document.getElementById(\"btnSaudacao\");\nconsole.log(btn); // o elemento <button>"]}, {"c": "JavaScript puro × React", "q": "No script.js original, qual propriedade era usada para trocar o texto exibido na tela?", "o": ["element.value", "element.textContent", "element.innerHTML.render()", "setMensagem()"], "a": 1, "e": ["value é muito usado em inputs e outros elementos de formulário.", "Correto. textContent altera o conteúdo textual de um elemento do DOM.", "Essa combinação não existe. innerHTML é uma propriedade que pode receber HTML como string.", "setMensagem é um nome típico de função de atualização de estado em React, não uma propriedade do DOM."], "g": "JS puro × React", "d": ["textContent troca só o texto de um elemento. Diferente de innerHTML, ele não interpreta tags, então é mais seguro para texto simples.", "const msg = document.getElementById(\"mensagem\");\nmsg.textContent = \"Olá, Ana!\";"]}, {"c": "JavaScript puro × React", "q": "Como um clique de botão era tratado no JavaScript puro?", "o": ["onClick={handleClick} dentro do JSX", "btn.addEventListener(\"click\", funcao)", "btn.onPress(funcao)", "useEffect(() => {...}, [])"], "a": 1, "e": ["Essa sintaxe é usada em JSX/React.", "Correto. addEventListener registra uma função para responder ao evento de clique.", "onPress não é o método padrão usado para cliques em elementos HTML no JavaScript do navegador.", "useEffect é um Hook do React e não é a API usada para registrar um clique no DOM puro."], "g": "JS puro × React", "d": ["addEventListener “fica escutando” um evento (click, keyup...) e chama a função quando ele acontece. Você passa a função sem parênteses.", "btn.addEventListener(\"click\", saudar);\n// saudar roda a cada clique"]}, {"c": "JavaScript puro × React", "q": "No script.js original, como a cor do texto era alterada diretamente?", "o": ["texto.style.color = \"blue\"", "texto.className = \"azul\"", "setCorAzul(true)", "texto.color.set(\"blue\")"], "a": 0, "e": ["Correto. A propriedade style permite alterar estilos inline diretamente pelo DOM.", "className poderia trocar classes, mas não é a instrução descrita para alterar diretamente a propriedade color.", "Esse padrão representa atualização de estado em React, não manipulação direta no DOM.", "Essa API não existe para elementos HTML."], "g": "JS puro × React", "d": ["Todo elemento tem a propriedade style. Nela você altera propriedades do CSS em camelCase (backgroundColor, fontSize).", "texto.style.color = \"blue\";\ntexto.style.fontSize = \"20px\";"]}, {"c": "JavaScript puro × React", "q": "Qual é a principal diferença de raciocínio ao atualizar a interface?", "o": ["No JS puro cada ação pode manipular o DOM diretamente; no React, uma ação atualiza o estado e o React atualiza a interface", "No React não existem eventos de clique", "No JS puro não é possível usar funções", "Não há diferença nenhuma"], "a": 0, "e": ["Correto. Essa é uma das principais diferenças de abordagem entre os dois modelos.", "React possui eventos como onClick, onChange, onSubmit e vários outros.", "Funções são fundamentais no JavaScript puro.", "Há diferenças importantes na forma como a interface é organizada e atualizada."], "g": "JS puro × React", "d": ["A grande mudança é de mentalidade: no JS puro você diz COMO mexer na tela passo a passo. No React você só atualiza o estado e descreve como a tela deve ficar; o React cuida do resto.", "// JS puro\ntexto.textContent = \"Oi\";\n// React\nsetMensagem(\"Oi\");"]}, {"c": "JSX", "q": "No HTML/JSX, o atributo class do HTML puro vira qual atributo no React?", "o": ["styleClass", "className", "classes", "cssName"], "a": 1, "e": ["Não é o atributo padrão do JSX para classes CSS.", "Correto. JSX usa className para representar o atributo class do HTML.", "Não é o atributo padrão para classes em JSX.", "Também não é um atributo padrão do React."], "g": "JSX", "d": ["class é palavra reservada do JavaScript (usada para criar classes), e o JSX é JavaScript. Por isso o atributo virou className.", "<div className=\"card\">...</div>"]}, {"c": "JSX", "q": "Como um estilo inline é escrito em JSX?", "o": ["style=\"color: blue\"", "style={{ color: \"blue\" }}", "css={color: blue}", "colorStyle=\"blue\""], "a": 1, "e": ["Essa é a forma tradicional de HTML. Em JSX, style recebe um objeto JavaScript.", "Correto. O primeiro par de chaves entra no JavaScript e o segundo representa o objeto de estilo.", "Essa sintaxe não representa corretamente um estilo inline JSX.", "Não é uma propriedade padrão de estilo do JSX."], "g": "JSX", "d": ["Em JSX o style recebe um objeto, não uma string. As chaves de fora são “entrei no JavaScript” e as de dentro são o objeto. Propriedades usam camelCase.", "<p style={{ color: \"blue\", fontSize: \"20px\" }}>Oi</p>"]}, {"c": "React", "q": "No JS puro, uma variável guardava o contador manualmente. Qual é o equivalente típico em React?", "o": ["const contador = 0;", "const [contador, setContador] = useState(0);", "var contador = new State(0);", "props.contador = 0;"], "a": 1, "e": ["Isso cria uma constante que não pode ser atualizada daquela maneira para provocar renderizações.", "Correto. O primeiro item é o estado atual e o segundo é a função que atualiza esse estado.", "Essa não é a API padrão do React para criar estado.", "Props são recebidas pelo componente e não devem ser alteradas diretamente."], "g": "React", "d": ["Variável comum não avisa o React quando muda. useState devolve o valor atual e uma função para alterá-lo; ao chamar essa função, o React renderiza de novo.", "const [contador, setContador] = useState(0);\nsetContador(contador + 1);"]}, {"c": "React + JSX", "q": "No React, como a interface visual normalmente é escrita?", "o": ["Sempre em um arquivo .html separado", "Em JSX, junto da lógica dentro do componente", "Como uma string dentro do CSS", "React não usa HTML de forma alguma"], "a": 1, "e": ["React pode usar um HTML base, mas a interface dos componentes normalmente é escrita em JSX.", "Correto. JSX permite declarar a estrutura visual próxima da lógica do componente.", "CSS cuida da apresentação; não é onde a árvore da interface é declarada.", "React usa elementos semelhantes ao HTML por meio do JSX."], "g": "React", "d": ["No React a estrutura visual (JSX) mora dentro do componente, junto com a lógica dele. Você não separa mais em index.html e script.js para cada parte da tela.", "function Saudacao() {\n  const [nome, setNome] = useState(\"\");\n  return <input value={nome} />;\n}"]}, {"c": "CSS + React", "q": "Por que um style.css pode continuar sendo usado depois de migrar um projeto para React?", "o": ["Porque React não aceita CSS", "Porque classes e IDs usados pelos componentes podem continuar correspondendo às regras CSS", "Porque o Vite transforma todo CSS em JSX automaticamente", "Porque o projeto deixa de usar estilos"], "a": 1, "e": ["React aceita e usa CSS normalmente.", "Correto. Se o JSX mantém className e id compatíveis com as regras existentes, o CSS pode continuar funcionando.", "Vite processa CSS, mas não transforma as regras em JSX dessa forma.", "A interface continua podendo usar estilos CSS normalmente."], "g": "React", "d": ["O CSS seleciona elementos por classe (.card) e id (#contador). Se o JSX mantém os mesmos className e id, as regras continuam valendo, então o arquivo CSS quase não muda.", "/* style.css */\n.card { padding: 20px; }\n\n// JSX\n<section className=\"card\">...</section>"]}, {"c": "React", "q": "O que useState(0) retorna?", "o": ["Apenas o número 0", "Um array com dois itens: valor atual e função de atualização", "Um componente React", "Uma Promise"], "a": 1, "e": ["useState retorna mais do que o valor inicial.", "Correto. Por isso é comum usar a desestruturação const [valor, setValor] = useState(...).", "useState cria e controla estado; não retorna um componente.", "useState não é uma API assíncrona baseada em Promise."], "g": "React", "d": ["useState devolve um array de dois itens. Por isso usamos desestruturação para dar nome a cada um: [valorAtual, funçãoQueAtualiza].", "const [contador, setContador] = useState(0);\n// contador -> 0\n// setContador -> função"]}, {"c": "React", "q": "Por que um input pode usar value={numero1} junto com onChange?", "o": ["Porque isso é obrigatório em qualquer HTML", "Para tornar o input controlado e sincronizado com o estado do React", "Porque inputs numéricos exigem essa sintaxe", "Apenas para melhorar a performance visual"], "a": 1, "e": ["HTML puro não exige value controlado por React.", "Correto. O valor exibido vem do estado e o onChange atualiza esse estado.", "Inputs numéricos podem existir sem React e sem essa estrutura.", "A finalidade principal é controlar e sincronizar o valor com o estado."], "g": "React", "d": ["Input controlado: o que aparece no campo vem do estado (value), e cada digitação atualiza o estado (onChange). Assim o React sempre sabe o valor do campo.", "<input\n  value={numero1}\n  onChange={(e) => setNumero1(e.target.value)}\n/>"]}, {"c": "React + CSS", "q": "Por que um id como id=\"contador\" pode ser mantido em um componente React?", "o": ["Porque React exige id em toda tag p", "Para manter compatibilidade com uma regra CSS como #contador", "Porque useState precisa de um id correspondente", "Porque sem id o componente não renderiza"], "a": 1, "e": ["React não exige isso.", "Correto. IDs podem continuar sendo usados para aplicar estilos ou identificar elementos.", "useState não depende de IDs HTML.", "Componentes React podem renderizar normalmente sem IDs."], "g": "React", "d": ["O id é um atributo HTML comum e continua valendo no JSX. Foi mantido para que a regra #contador do CSS ainda encontre o elemento.", "#contador { font-size: 40px; }\n\n<p id=\"contador\">{contador}</p>"]}, {"c": "Componentes", "q": "Qual é uma vantagem de dividir a interface em componentes?", "o": ["Cada componente pode cuidar de uma parte da interface e ter seu próprio estado", "Componentes eliminam a necessidade de estado", "É a única maneira de usar CSS", "Componentes sempre deixam o projeto mais lento"], "a": 0, "e": ["Correto. Componentização favorece organização, isolamento e reutilização.", "Componentes podem usar estado normalmente.", "CSS pode ser usado de diversas formas em projetos React.", "Não existe essa regra geral; componentes são uma forma de organizar a aplicação."], "g": "React", "d": ["Dividir em componentes deixa cada parte pequena, com sua lógica e seu estado. Fica mais fácil de entender, de consertar e de reutilizar.", "<Saudacao />\n<Contador />\n<MudarCor />\n<Calculadora />"]}, {"c": "React", "q": "O que acontece quando chamamos setContador(contador + 1)?", "o": ["Nada muda até recarregar a página", "O estado é atualizado e o componente é renderizado novamente com o novo valor", "É obrigatório usar document.getElementById depois", "O componente é destruído e recriado do zero"], "a": 1, "e": ["A atualização de estado normalmente provoca uma nova renderização do componente.", "Correto. React usa a atualização de estado para atualizar a interface.", "Uma das vantagens do React é justamente não precisar fazer essa manipulação manual nesse caso.", "Re-renderizar não significa simplesmente destruir e recriar tudo dessa forma."], "g": "React", "d": ["O setter guarda o novo valor e pede ao React para renderizar o componente de novo. Na nova renderização, a variável já vem com o valor atualizado.", "function Contador() {\n  const [contador, setContador] = useState(0);\n  return <button onClick={() => setContador(contador + 1)}>{contador}</button>;\n}"]}, {"c": "React", "q": "Se <Contador /> aparecer duas vezes, como fica o estado?", "o": ["Os dois compartilham automaticamente o mesmo contador", "Cada instância possui seu próprio estado, independente da outra", "Isso gera erro", "O segundo sobrescreve o primeiro"], "a": 1, "e": ["Cada instância possui seu próprio estado local.", "Correto. O estado criado com useState pertence à instância do componente.", "É perfeitamente válido renderizar o mesmo componente várias vezes.", "As duas instâncias coexistem e mantêm estados separados."], "g": "React", "d": ["O estado pertence a cada instância do componente. Duas vezes o mesmo componente = dois contadores independentes, cada um com o seu valor.", "<Contador /> // vai a 3\n<Contador /> // continua em 0"]}, {"c": "JSX", "q": "O que é JSX?", "o": ["Uma linguagem de template completamente separada do JavaScript", "Uma sintaxe que permite escrever uma estrutura parecida com HTML dentro do JavaScript", "Um arquivo de configuração do Vite", "Um tipo especial de CSS"], "a": 1, "e": ["JSX é uma extensão/sintaxe que pode ser transformada em JavaScript.", "Correto. JSX é usado para descrever a interface de componentes.", "Vite possui seus próprios arquivos de configuração. JSX é sintaxe para a interface.", "JSX e CSS têm funções diferentes."], "g": "JSX", "d": ["JSX é uma sintaxe que parece HTML mas é JavaScript. O Vite transforma o JSX em chamadas JavaScript comuns antes de o navegador ler.", "const elemento = <h1>Olá</h1>;"]}, {"c": "React", "q": "Por que um estado booleano como corAzul pode começar com false?", "o": ["Porque false é sempre o padrão do useState", "Para representar inicialmente que o texto ainda não está azul", "Porque React não aceita true como valor inicial", "É obrigatório usar false para booleanos"], "a": 1, "e": ["useState aceita qualquer valor inicial válido, inclusive true.", "Correto. O valor inicial deve representar o estado visual desejado antes do primeiro clique.", "React aceita true normalmente.", "O desenvolvedor escolhe true ou false conforme a lógica da aplicação."], "g": "React", "d": ["O valor inicial do estado deve representar a situação da tela antes de qualquer clique. Aqui, o texto ainda não está azul, então corAzul começa false.", "const [corAzul, setCorAzul] = useState(false);\n// clique -> setCorAzul(true)"]}, {"c": "React", "q": "Qual é uma finalidade do React.StrictMode?", "o": ["Deixar automaticamente a aplicação mais rápida em produção", "Ajudar a detectar problemas e práticas potencialmente inadequadas durante o desenvolvimento", "Fazer o CSS funcionar", "Substituir ReactDOM.createRoot"], "a": 1, "e": ["StrictMode é uma ferramenta de desenvolvimento, não um acelerador automático de produção.", "Correto. Ele ativa verificações adicionais em desenvolvimento.", "CSS não depende de StrictMode para funcionar.", "StrictMode e createRoot têm funções diferentes."], "g": "React", "d": ["StrictMode é uma ferramenta só de desenvolvimento: ele faz verificações extras e avisa sobre práticas problemáticas. Não muda o que o usuário vê.", "<React.StrictMode>\n  <App />\n</React.StrictMode>"]}, {"c": "React", "q": "O que uma função handleClick pode fazer em Saudacao.jsx?", "o": ["Verificar o nome e atualizar a mensagem usando setMensagem", "Criar obrigatoriamente um novo componente", "Modificar diretamente textContent", "Reiniciar o nome automaticamente em todos os casos"], "a": 0, "e": ["Correto. A função pode ler o estado atual e chamar o setter para atualizar a mensagem.", "Uma função de evento não precisa criar componentes.", "Isso seria uma abordagem de manipulação direta do DOM, desnecessária nesse padrão React.", "Isso só aconteceria se a função tivesse esse código específico."], "g": "React", "d": ["handleClick é uma função comum que roda no clique. Ela pode ler o estado (nome), decidir o que fazer e chamar setMensagem para mudar a tela.", "function handleClick() {\n  if (nome === \"\") setMensagem(\"Digite o nome!\");\n  else setMensagem(\"Olá, \" + nome);\n}"]}, {"c": "Vite", "q": "Qual comando cria a estrutura inicial com Vite e template React?", "o": ["npm create vite@latest meu-primeiro-javascript-react -- --template react", "npm install react", "node create-react-app", "npm run build react"], "a": 0, "e": ["Correto. Esse comando cria um projeto Vite usando o template React.", "Esse comando instala React, mas não cria a estrutura completa do projeto Vite dessa maneira.", "Esse não é o comando correto para criar o projeto Vite.", "npm run build executa um script existente; não cria um projeto."], "g": "Vite e projeto", "d": ["npm create vite cria a estrutura do projeto. O --template react escolhe o modelo com React já configurado. Depois vêm npm install e npm run dev.", "npm create vite@latest meu-projeto -- --template react\ncd meu-projeto\nnpm install\nnpm run dev"]}, {"c": "Estrutura", "q": "Onde podem ficar os componentes Saudacao.jsx, Contador.jsx, MudarCor.jsx e Calculadora.jsx?", "o": ["Diretamente na raiz obrigatoriamente", "Dentro de src/components/", "Dentro de public/", "Dentro de index.html"], "a": 1, "e": ["Eles podem ser organizados em uma pasta específica.", "Correto. Essa é uma organização comum e corresponde à estrutura descrita no projeto.", "public normalmente guarda arquivos estáticos, não componentes React.", "index.html não é uma pasta nem um local para armazenar arquivos JSX."], "g": "Vite e projeto", "d": ["É convenção guardar os componentes em src/components. A pasta public é para arquivos estáticos (imagens, ícones), não para código React.", "src/\n  components/\n    Saudacao.jsx\n    Contador.jsx\n  App.jsx\n  main.jsx"]}, {"c": "React", "q": "Qual é o papel do App.jsx nesse projeto?", "o": ["Organizar e renderizar os componentes principais da aplicação", "Substituir obrigatoriamente o style.css", "Executar o servidor do Vite", "Guardar toda a configuração do npm"], "a": 0, "e": ["Correto. App pode importar os componentes e montar a estrutura da interface.", "App e CSS têm responsabilidades diferentes.", "O servidor é iniciado pelos scripts do projeto, como npm run dev.", "A configuração do npm fica principalmente no package.json e arquivos relacionados."], "g": "React", "d": ["App é o componente “principal”: ele importa os outros componentes e monta a estrutura da página (header, main, footer).", "function App() {\n  return (\n    <main>\n      <Saudacao />\n      <Contador />\n    </main>\n  );\n}"]}, {"c": "JavaScript", "q": "Em uma calculadora, o objeto contas pode armazenar o quê?", "o": ["O histórico completo de todos os cálculos", "Os resultados das quatro operações já calculadas", "Somente os valores antes de conversão", "Somente mensagens de erro"], "a": 1, "e": ["Um objeto chamado contas pode até guardar isso se programado para tal, mas não é essa a função descrita.", "Correto. Ele pode agrupar soma, subtração, multiplicação e divisão.", "Isso descreve uma possibilidade diferente de organização dos dados.", "Mensagens de erro podem existir, mas não são a função do objeto contas descrito."], "g": "JavaScript e calculadora", "d": ["Um objeto agrupa valores relacionados com nomes. Na calculadora, contas junta o resultado de cada operação para escolher depois qual mostrar.", "const contas = {\n  soma: n1 + n2,\n  subtracao: n1 - n2,\n  multiplicacao: n1 * n2,\n  divisao: n1 / n2\n};"]}, {"c": "Validação", "q": "O que deve acontecer se numero1 ou numero2 estiver vazio?", "o": ["Mostrar uma mensagem como \"Preencha os dois campos!\" e interromper a função", "O React trava", "O vazio é sempre considerado zero", "Nada acontece porque o botão é automaticamente desabilitado"], "a": 0, "e": ["Correto. A validação evita tentar calcular com dados ausentes.", "Uma validação bem feita impede que o cálculo inválido seja executado.", "Isso depende da conversão e da lógica, mas não é o comportamento descrito.", "O botão só seria desabilitado se o código implementasse essa regra."], "g": "JavaScript e calculadora", "d": ["Validar é checar os dados antes de usar. Se faltar algum número, mostramos um aviso e usamos return para parar a função, sem calcular.", "if (numero1 === \"\" || numero2 === \"\") {\n  setResultado(\"Preencha os dois campos!\");\n  return;\n}"]}, {"c": "JavaScript", "q": "O que acontece se o usuário tentar dividir por zero na calculadora?", "o": ["O resultado sempre será Infinity na aplicação", "A função mostra \"Não é possível dividir por zero!\" e interrompe o cálculo", "A aplicação obrigatoriamente para de funcionar", "React converte automaticamente zero para outro valor"], "a": 1, "e": ["JavaScript pode produzir Infinity em uma divisão numérica por zero, mas a lógica da calculadora pode interceptar o caso antes.", "Correto para a lógica descrita no projeto.", "Uma validação pode tratar o caso sem quebrar a aplicação.", "React não altera regras matemáticas do JavaScript dessa forma."], "g": "JavaScript e calculadora", "d": ["Dividir por zero em JavaScript dá Infinity, o que não ajuda o usuário. A calculadora checa o caso antes e mostra uma mensagem clara.", "if (operacao === \"divisao\" && n2 === 0) {\n  setResultado(\"Não é possível dividir por zero!\");\n  return;\n}"]}, {"c": "React", "q": "Qual arquivo é o ponto de entrada que conecta o React à div #root?", "o": ["src/App.jsx", "src/main.jsx", "src/style.css", "vite.config.js"], "a": 1, "e": ["App normalmente é o componente principal, mas a montagem na raiz ocorre no arquivo de entrada.", "Correto. main.jsx normalmente cria a raiz e renderiza App dentro dela.", "CSS não é o ponto de entrada da árvore React.", "Esse arquivo configura o Vite; não monta a aplicação na div root."], "g": "React", "d": ["main.jsx é a “porta de entrada”: ele pega a div #root do index.html e coloca o React dentro dela, renderizando o App.", "import App from \"./App\";\nReactDOM.createRoot(document.getElementById(\"root\")).render(<App />);"]}, {"c": "ReactDOM", "q": "O que faz ReactDOM.createRoot(document.getElementById(\"root\")).render(<App />)?", "o": ["Cria uma raiz React na div #root e renderiza o componente informado nela", "Cria um novo arquivo HTML", "Instala dependências", "Compila somente o CSS"], "a": 0, "e": ["Correto. É a ligação entre a árvore React e o elemento root do HTML.", "O HTML já existe; a chamada monta a aplicação dentro de um elemento existente.", "Instalação é feita por npm.", "A função está relacionada à renderização React, não à compilação isolada de CSS."], "g": "Vite e projeto", "d": ["Lendo por partes: getElementById(\"root\") acha a div; createRoot cria a raiz do React nela; render(<App />) manda desenhar o App lá dentro.", "ReactDOM\n  .createRoot(document.getElementById(\"root\"))\n  .render(<App />);"]}, {"c": "Vite", "q": "Qual comando gera a versão de produção para verificar se o projeto compila?", "o": ["npm run dev", "npm run build", "npm install react", "npm create vite"], "a": 1, "e": ["Esse comando normalmente inicia o servidor de desenvolvimento.", "Correto. O build gera a versão de produção e ajuda a detectar erros de compilação.", "Esse comando instala dependências, não gera o build.", "Esse comando serve para criação de projeto, não para gerar a versão final de um projeto existente."], "g": "Vite e projeto", "d": ["npm run build gera a versão otimizada de produção e mostra erros de compilação. É bom rodar antes de entregar. npm run dev é só para desenvolver.", "npm run build\n# cria a pasta dist/ se estiver tudo certo"]}, {"c": "CSS — Flexbox", "q": "Para que serve display: flex?", "o": ["Transformar o elemento em um container flexível para organizar seus filhos", "Deletar os elementos filhos", "Transformar CSS em JavaScript", "Criar automaticamente um banco de dados"], "a": 0, "e": ["Correto. display:flex cria um flex container e permite controlar o posicionamento dos elementos filhos.", "Flexbox não remove elementos.", "Flexbox é um modelo de layout CSS.", "Não há relação entre Flexbox e banco de dados."], "g": "Flexbox e CSS", "d": ["display: flex transforma um elemento em container flexível. Os filhos diretos viram itens flex e ficam lado a lado por padrão.", ".menu {\n  display: flex;\n}"]}, {"c": "CSS — Flexbox", "q": "O que flex-direction: column faz?", "o": ["Coloca os itens principais em uma coluna, um abaixo do outro", "Deixa todos os itens obrigatoriamente na mesma linha", "Centraliza horizontalmente automaticamente", "Remove o espaçamento entre elementos"], "a": 0, "e": ["Correto. O eixo principal passa a ser vertical.", "Isso se aproxima mais do comportamento padrão row.", "Centralização depende de propriedades como justify-content e align-items.", "Espaçamento é controlado por gap, margin, padding e outras propriedades."], "g": "Flexbox e CSS", "d": ["flex-direction define o eixo principal. Com column, o eixo principal passa a ser vertical e os itens ficam empilhados.", ".lista {\n  display: flex;\n  flex-direction: column;\n}"]}, {"c": "CSS — Flexbox", "q": "Em um flex container com flex-direction: row, o que justify-content: center faz?", "o": ["Centraliza os itens no eixo principal, que é horizontal", "Centraliza sempre no eixo vertical", "Altera a cor dos itens", "Faz os itens desaparecerem"], "a": 0, "e": ["Correto. Com row, o eixo principal é horizontal.", "No padrão row, o eixo vertical é o eixo transversal.", "justify-content é uma propriedade de alinhamento, não de cor.", "A propriedade não remove elementos."], "g": "Flexbox e CSS", "d": ["justify-content alinha ao longo do eixo principal. Em row ele é horizontal, então center junta os itens no meio da linha.", ".linha {\n  display: flex;\n  justify-content: center;\n}"]}, {"c": "CSS — Flexbox", "q": "Em um flex container com flex-direction: row, o que align-items: center normalmente faz?", "o": ["Alinha os itens ao centro no eixo transversal, normalmente vertical", "Alinha os itens ao centro horizontal usando o eixo principal", "Muda a fonte para centralizada", "Cria uma nova linha de elementos"], "a": 0, "e": ["Correto. Com row, o eixo transversal é vertical.", "O eixo principal é controlado principalmente por justify-content.", "Isso não altera text-align ou fonte.", "Ele apenas controla alinhamento no eixo transversal."], "g": "Flexbox e CSS", "d": ["align-items alinha no eixo transversal (o oposto do principal). Em row, esse eixo é o vertical.", ".linha {\n  display: flex;\n  height: 200px;\n  align-items: center;\n}"]}, {"c": "CSS — Flexbox", "q": "Qual propriedade cria espaçamento entre os itens de um flex container sem precisar colocar margin em cada filho?", "o": ["gap", "font-space", "item-distance", "flex-space-only"], "a": 0, "e": ["Correto. gap define o espaço entre os itens do container.", "Essa propriedade não é usada para isso.", "Não é uma propriedade CSS padrão.", "Não existe essa propriedade CSS padrão."], "g": "Flexbox e CSS", "d": ["gap cria espaço só ENTRE os itens do container. É mais simples do que colocar margin em cada filho.", ".cards {\n  display: flex;\n  gap: 16px;\n}"]}, {"c": "CSS — Flexbox", "q": "O que flex-wrap: wrap permite?", "o": ["Permite que os itens passem para outras linhas quando não houver espaço suficiente", "Impede qualquer quebra de linha", "Quebra o texto de todos os parágrafos", "Cria automaticamente novas páginas HTML"], "a": 0, "e": ["Correto. É muito útil para layouts responsivos.", "Isso seria mais próximo de flex-wrap: nowrap.", "A propriedade trata dos itens flex, não da quebra textual comum.", "Não existe essa relação."], "g": "Flexbox e CSS", "d": ["Por padrão os itens ficam numa linha só. Com flex-wrap: wrap, quando não cabe mais, eles passam para a linha de baixo. Ótimo para telas pequenas.", ".cards {\n  display: flex;\n  flex-wrap: wrap;\n}"]}, {"c": "CSS — Flexbox", "q": "Qual é uma diferença importante entre margin e padding?", "o": ["Margin fica fora da borda; padding fica entre o conteúdo e a borda", "São exatamente a mesma coisa", "Padding só funciona em imagens", "Margin só funciona com Flexbox"], "a": 0, "e": ["Correto. Essa diferença é fundamental no Box Model do CSS.", "Eles têm funções diferentes no Box Model.", "Padding pode ser usado em diversos elementos.", "Margin existe independentemente de Flexbox."], "g": "Flexbox e CSS", "d": ["Box Model: conteúdo → padding (espaço dentro, entre conteúdo e borda) → borda → margin (espaço fora, afastando de outros elementos).", ".card {\n  padding: 20px; /* dentro */\n  margin: 20px;  /* fora */\n}"]}, {"c": "CSS", "q": "O que box-sizing: border-box faz?", "o": ["Faz width e height considerarem o conteúdo, padding e borda dentro do tamanho definido", "Remove todas as bordas", "Transforma todo elemento em flex", "Faz o elemento ocupar sempre 100% da tela"], "a": 0, "e": ["Correto. Isso facilita o controle previsível das dimensões dos elementos.", "Não remove bordas.", "Não altera display.", "Não existe esse efeito automático."], "g": "Flexbox e CSS", "d": ["Por padrão, padding e borda SOMAM ao width. Com border-box, o width já inclui tudo, então o tamanho fica previsível.", "* {\n  box-sizing: border-box;\n}"]}, {"c": "CSS", "q": "Para que serve @media (max-width: 650px)?", "o": ["Aplicar regras CSS quando a largura da viewport for igual ou menor que 650px", "Executar JavaScript quando o mouse clicar", "Criar uma variável JavaScript", "Alterar o banco de dados quando a tela diminuir"], "a": 0, "e": ["Correto. É uma media query usada para adaptar o layout a telas menores.", "Media queries são CSS e respondem às características do dispositivo/viewport.", "Não é uma construção JavaScript.", "Não há essa função."], "g": "Flexbox e CSS", "d": ["Media query aplica regras só quando a tela atende a uma condição. max-width: 650px vale para telas de até 650px, como celulares.", "@media (max-width: 650px) {\n  .container { width: 96%; }\n}"]}, {"c": "CSS — Flexbox", "q": "No quiz deste arquivo, por que .answers usa display: flex e flex-direction: column?", "o": ["Para organizar as alternativas verticalmente usando o modelo Flexbox", "Para transformar as alternativas em imagens", "Para substituir completamente o JavaScript", "Para impedir qualquer interação com os botões"], "a": 0, "e": ["Correto. O container flex organiza os botões em uma coluna e permite usar gap, alinhamento e outras propriedades.", "Flexbox não transforma elementos em imagens.", "CSS controla apresentação; JavaScript controla comportamento e lógica.", "Os botões continuam clicáveis normalmente."], "g": "Flexbox e CSS", "d": [".answers é o container das alternativas. Com flex + column, elas ficam uma abaixo da outra, e o gap cuida do espaço entre elas.", ".answers {\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}"]}, {"c": "Funções", "q": "Qual é a forma tradicional de declarar uma função que soma dois números?", "o": ["function somar(a, b) { return a + b; }", "func somar(a, b) => a + b;", "def somar(a, b): return a + b", "function = somar(a, b) { a + b }"], "a": 0, "e": ["Correto. Palavra-chave function, nome, parâmetros entre parênteses e o corpo entre chaves.", "func não é palavra-chave do JavaScript, e => não é usado assim em declaração.", "Isso é Python, não JavaScript.", "A sintaxe está errada: não se usa \"=\" depois de function."], "g": "Funções", "d": ["Função é um bloco de código com nome que você pode executar quando quiser. function, nome, parâmetros entre parênteses e corpo entre chaves.", "function somar(a, b) {\n  return a + b;\n}\nsomar(2, 3); // 5"]}, {"c": "Funções", "q": "Em function saudar(nome) { ... } e na chamada saudar(\"Ana\"), o que é \"nome\" e o que é \"Ana\"?", "o": ["nome é o argumento e \"Ana\" é o parâmetro", "nome é o parâmetro e \"Ana\" é o argumento", "Os dois são parâmetros", "Os dois são argumentos"], "a": 1, "e": ["Está invertido.", "Correto. Parâmetro é a variável na declaração; argumento é o valor passado na chamada.", "O valor \"Ana\" é passado na chamada, então é argumento.", "\"nome\" fica na declaração, então é parâmetro."], "g": "Funções", "d": ["Parâmetro é o “espaço reservado” na declaração. Argumento é o valor real que você entrega na chamada.", "function saudar(nome) { } // nome = parâmetro\nsaudar(\"Ana\");             // \"Ana\" = argumento"]}, {"c": "Funções", "q": "O que o comando return faz dentro de uma função?", "o": ["Repete a função de novo", "Devolve um valor para quem chamou a função e encerra a execução dela", "Apaga a função da memória", "Mostra o valor na tela automaticamente"], "a": 1, "e": ["Isso seria um loop ou recursão.", "Correto. Depois do return, nada mais dentro da função é executado.", "A função continua existindo.", "Para mostrar na tela é preciso console.log, alert ou atualizar a interface."], "g": "Funções", "d": ["return entrega um resultado para quem chamou e encerra a função. Qualquer linha depois dele não roda.", "function dobro(n) {\n  return n * 2;\n  console.log(\"nunca roda\");\n}\nlet r = dobro(4); // 8"]}, {"c": "Funções", "q": "O que uma função sem nenhum return devolve?", "o": ["0", "null", "undefined", "Uma string vazia"], "a": 2, "e": ["Não devolve 0 automaticamente.", "null é um valor que o programador atribui de propósito.", "Correto. Sem return, o resultado da chamada é undefined.", "Não devolve string vazia."], "g": "Funções", "d": ["Se a função não tem return (ou return vazio), o resultado da chamada é undefined. Ela pode até fazer coisas, mas não devolve valor.", "function oi() {\n  console.log(\"oi\");\n}\nlet x = oi(); // x é undefined"]}, {"c": "Funções", "q": "Qual arrow function é equivalente a function dobro(n) { return n * 2; }?", "o": ["const dobro = n -> n * 2;", "const dobro = (n) => n * 2;", "const dobro = => n * 2;", "const dobro(n) => n * 2;"], "a": 1, "e": ["-> não existe em JavaScript.", "Correto. Sem chaves, o valor da expressão é retornado automaticamente.", "Faltam os parâmetros antes da seta.", "Não se coloca (n) depois do nome da const."], "g": "Funções", "d": ["Arrow function é uma forma mais curta de escrever função. Se o corpo é uma expressão só, o return é implícito.", "const dobro = (n) => n * 2;\n// igual a function dobro(n) { return n * 2; }"]}, {"c": "Funções", "q": "Declarar uma função basta para ela executar?", "o": ["Sim, executa assim que é declarada", "Não, ela só executa quando é chamada, usando () depois do nome", "Sim, mas só dentro de um if", "Não, só executa com useState"], "a": 1, "e": ["Declarar apenas define o que a função faz.", "Correto. Por exemplo: somar(2, 3) executa a função.", "A declaração não depende de if.", "useState não tem relação com isso."], "g": "Funções", "d": ["Declarar apenas ensina ao JavaScript o que a função faz. Ela só executa quando você chama, com parênteses.", "function oi() { alert(\"oi\"); }\noi(); // agora sim executa"]}, {"c": "Funções + React", "q": "Qual é a diferença entre onClick={handleClick} e onClick={handleClick()}?", "o": ["Nenhuma, funcionam igual", "O primeiro passa a função para ser chamada no clique; o segundo executa a função já na renderização", "O primeiro dá erro; o segundo é o correto", "O segundo só funciona com useState"], "a": 1, "e": ["Há diferença importante: os parênteses chamam a função na hora.", "Correto. Sem parênteses você entrega a função ao React; com parênteses você entrega o resultado dela.", "O primeiro é o padrão correto.", "Não depende de useState."], "g": "Funções", "d": ["Com parênteses, a função é executada NA HORA da renderização e o clique receberia o resultado dela. Sem parênteses, você entrega a função para o React chamar só no clique.", "<button onClick={handleClick}>OK</button>     // certo\n<button onClick={handleClick()}>OK</button>   // errado"]}, {"c": "Funções", "q": "O que é uma função callback?", "o": ["Uma função que só roda uma vez", "Uma função passada como argumento para outra função, que a chama depois", "Uma função que retorna sempre true", "Uma função criada só com arrow function"], "a": 1, "e": ["Uma callback pode rodar várias vezes.", "Correto. Exemplo: o segundo argumento de addEventListener(\"click\", funcao).", "O retorno não é o que define uma callback.", "Pode ser criada com function ou arrow."], "g": "Funções", "d": ["Callback é uma função entregue a outra função para ser chamada depois, quando algo acontecer.", "btn.addEventListener(\"click\", function () {\n  alert(\"clicou!\");\n});"]}, {"c": "Funções", "q": "Uma variável criada com let dentro de uma função pode ser usada fora dela?", "o": ["Sim, em qualquer lugar do arquivo", "Não, ela existe só dentro da função (escopo local)", "Sim, mas só depois de um return", "Somente se usar var"], "a": 1, "e": ["Isso seria escopo global.", "Correto. Variáveis locais só existem dentro da função onde foram criadas.", "O return devolve valores, mas não libera variáveis.", "var também respeita o escopo de função."], "g": "Funções", "d": ["Variáveis criadas dentro da função existem só ali (escopo local). Fora dela, o nome não é encontrado.", "function teste() {\n  let x = 5;\n}\nconsole.log(x); // erro: x is not defined"]}, {"c": "Funções + React", "q": "Como chamar uma função passando um argumento no onClick em React?", "o": ["onClick={somar(5)}", "onClick={() => somar(5)}", "onClick=\"somar(5)\"", "onClick=somar[5]"], "a": 1, "e": ["Isso executa somar(5) na renderização.", "Correto. A arrow function só chama somar(5) quando ocorre o clique.", "Isso é sintaxe de HTML, não de JSX.", "Sintaxe inválida."], "g": "Funções", "d": ["Para passar argumento, você precisa de uma função no meio: a arrow function é chamada no clique e só então executa somar(5).", "<button onClick={() => somar(5)}>+5</button>"]}, {"c": "Flexbox", "q": "Qual é o valor padrão de flex-direction em um flex container?", "o": ["column", "row", "row-reverse", "wrap"], "a": 1, "e": ["column precisa ser declarado.", "Correto. Por padrão os itens ficam lado a lado, na horizontal.", "row-reverse inverte a ordem e precisa ser declarado.", "wrap é valor de flex-wrap, não de flex-direction."], "g": "Flexbox e CSS", "d": ["Sem definir, o eixo principal é horizontal (row). Por isso os itens ficam lado a lado assim que você usa display: flex.", ".box {\n  display: flex;\n  /* flex-direction: row; é o padrão */\n}"]}, {"c": "Flexbox", "q": "Em qual elemento devemos aplicar display: flex para organizar itens lado a lado?", "o": ["Em cada item filho", "No elemento pai (o container)", "Somente no body", "No arquivo JavaScript"], "a": 1, "e": ["O filho só vira container se tiver seus próprios filhos.", "Correto. O pai vira o flex container e organiza os filhos.", "Pode ser aplicado em qualquer elemento.", "display é uma propriedade CSS."], "g": "Flexbox e CSS", "d": ["O display: flex vai no elemento PAI. Ele vira o container e organiza os filhos diretos.", ".pai { display: flex; }\n/* .filho não precisa de display: flex */"]}, {"c": "Flexbox", "q": "Quais propriedades centralizam um item horizontal e verticalmente em um container flex (com altura definida)?", "o": ["text-align e vertical-align", "justify-content: center e align-items: center", "flex-wrap: center", "gap: center"], "a": 1, "e": ["Não centralizam corretamente elementos flex.", "Correto. Uma centraliza no eixo principal e a outra no transversal.", "flex-wrap não aceita center.", "gap define espaço, não alinhamento."], "g": "Flexbox e CSS", "d": ["Para centralizar nos dois eixos: justify-content no eixo principal e align-items no transversal. O container precisa ter altura para o vertical aparecer.", ".centro {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n}"]}, {"c": "Flexbox", "q": "O que justify-content: space-between faz?", "o": ["Junta todos os itens no centro", "Coloca o primeiro item no início, o último no fim e distribui o espaço entre eles", "Cria espaço só antes do primeiro item", "Aumenta o tamanho de cada item"], "a": 1, "e": ["Isso seria justify-content: center.", "Correto. O espaço livre fica entre os itens.", "Isso lembra flex-end.", "Não altera o tamanho dos itens."], "g": "Flexbox e CSS", "d": ["space-between deixa o primeiro item no começo, o último no fim e reparte o espaço que sobra entre eles. Muito usado em menus.", ".menu {\n  display: flex;\n  justify-content: space-between;\n}"]}, {"c": "Flexbox", "q": "Com flex-direction: column, qual eixo o justify-content controla?", "o": ["O horizontal", "O vertical, que passa a ser o eixo principal", "Nenhum eixo", "Sempre os dois eixos"], "a": 1, "e": ["O horizontal virou o eixo transversal.", "Correto. justify-content sempre segue o eixo principal, e em column ele é vertical.", "Continua funcionando.", "Ele controla só o eixo principal."], "g": "Flexbox e CSS", "d": ["justify-content sempre segue o eixo principal. Em column, o eixo principal é o vertical, então ele alinha de cima para baixo.", ".coluna {\n  display: flex;\n  flex-direction: column;\n  height: 300px;\n  justify-content: center; /* centraliza na vertical */\n}"]}, {"c": "Flexbox", "q": "O que flex: 1 faz em um item filho?", "o": ["Faz o item ocupar 1px", "Faz o item crescer para ocupar o espaço livre do container", "Esconde o item", "Coloca o item na primeira posição"], "a": 1, "e": ["Não define tamanho em pixels.", "Correto. Com vários itens com flex: 1, o espaço é dividido igualmente.", "Não esconde nada.", "Para ordem existe a propriedade order."], "g": "Flexbox e CSS", "d": ["flex: 1 faz o item ocupar o espaço livre. Se vários itens têm flex: 1, dividem o espaço igualmente.", ".col { flex: 1; }"]}, {"c": "Flexbox", "q": "Qual é o comportamento padrão de flex-wrap?", "o": ["wrap: os itens quebram de linha", "nowrap: os itens ficam na mesma linha, mesmo sem espaço", "wrap-reverse", "Depende do navegador"], "a": 1, "e": ["wrap precisa ser declarado.", "Correto. Sem flex-wrap: wrap, os itens tendem a encolher para caber em uma linha.", "wrap-reverse precisa ser declarado.", "O padrão é definido pela especificação: nowrap."], "g": "Flexbox e CSS", "d": ["Por padrão é nowrap: os itens tentam ficar em uma linha só, encolhendo se preciso. Para quebrar linha, use wrap.", ".box {\n  display: flex;\n  flex-wrap: nowrap; /* padrão */\n}"]}, {"c": "Flexbox", "q": "Qual é uma vantagem de gap em relação a margin nos filhos?", "o": ["gap cria espaço só entre os itens, sem sobrar espaço nas bordas", "gap deixa o site mais rápido", "gap só funciona com imagens", "Não existe vantagem"], "a": 0, "e": ["Correto. Com margin, é comum sobrar espaço no último item.", "Não é uma questão de velocidade.", "Funciona com qualquer item do container.", "Existe: é mais simples e limpo."], "g": "Flexbox e CSS", "d": ["Com margin nos filhos, costuma sobrar espaço no primeiro ou último item. O gap coloca espaço só entre os itens, no container.", ".box { display: flex; gap: 10px; }"]}, {"c": "Flexbox", "q": "Qual é a diferença entre display: flex e display: inline-flex?", "o": ["Nenhuma", "flex ocupa a linha inteira como bloco; inline-flex fica em linha com o texto ao redor", "inline-flex remove os filhos", "flex só funciona em imagens"], "a": 1, "e": ["Existe diferença no comportamento externo do container.", "Correto. Por dentro os dois organizam os filhos do mesmo jeito.", "Não remove nada.", "Funciona em qualquer elemento."], "g": "Flexbox e CSS", "d": ["Os dois organizam os filhos do mesmo jeito por dentro. A diferença é por fora: flex ocupa a linha toda (como um bloco); inline-flex ocupa só o necessário e fica junto ao texto.", ".a { display: flex; }\n.b { display: inline-flex; }"]}, {"c": "Flexbox", "q": "Para que serve align-self em um item flex?", "o": ["Alinhar só aquele item de forma diferente dos outros, no eixo transversal", "Alinhar o texto do item", "Mudar a direção do container", "Definir o espaçamento entre itens"], "a": 0, "e": ["Correto. Ele sobrescreve o align-items do container para um único item.", "Para texto usa-se text-align.", "A direção é definida por flex-direction.", "O espaçamento é definido por gap."], "g": "Flexbox e CSS", "d": ["align-self funciona como um align-items individual: um item pode ter alinhamento diferente do resto no eixo transversal.", ".item-especial {\n  align-self: flex-end;\n}"]}, {"c": "React — Estado", "q": "Por que uma variável comum (let contador = 0) não atualiza a tela quando muda no React?", "o": ["Porque React não aceita números", "Porque mudar uma variável comum não avisa o React para renderizar de novo", "Porque let é proibido em componentes", "Porque só strings atualizam a tela"], "a": 1, "e": ["React aceita números normalmente.", "Correto. Só o estado (useState) dispara uma nova renderização.", "let pode ser usado, mas não dispara renderização.", "O tipo do valor não importa."], "g": "React", "d": ["Uma variável comum não faz o React perceber que algo mudou, então a tela não é redesenhada. Só o estado (useState) dispara nova renderização.", "let contador = 0;      // não atualiza a tela\nconst [c, setC] = useState(0); // atualiza"]}, {"c": "React — Estado", "q": "Por que não se deve fazer contador = contador + 1 direto em um estado do React?", "o": ["Porque dá erro de sintaxe sempre", "Porque a tela não é atualizada; é preciso usar o setter, como setContador", "Porque soma não funciona em React", "Porque só funciona dentro de um input"], "a": 1, "e": ["O problema não é de sintaxe, e sim de comportamento.", "Correto. O setter avisa o React que o estado mudou.", "Soma funciona normalmente.", "Não tem relação com input."], "g": "React", "d": ["Mudar o estado direto não avisa o React. É preciso chamar o setter, que grava o novo valor e provoca a renderização.", "contador = contador + 1;      // errado\nsetContador(contador + 1);    // certo"]}, {"c": "React — Props", "q": "O que são props em um componente React?", "o": ["Dados que o componente pai envia ao componente filho, somente para leitura", "Variáveis globais do navegador", "Estilos CSS do componente", "Funções do Vite"], "a": 0, "e": ["Correto. Exemplo: <Saudacao nome=\"Ana\" />.", "Props são dados de componentes, não globais do navegador.", "Estilos são outra coisa.", "Não têm relação com o Vite."], "g": "React", "d": ["Props são as “informações de entrada” do componente, enviadas pelo pai. O filho lê e usa, mas não deve alterá-las.", "function Saudacao({ nome }) {\n  return <p>Olá, {nome}!</p>;\n}\n<Saudacao nome=\"Ana\" />"]}, {"c": "React — Inputs", "q": "Em onChange={(e) => setNome(e.target.value)}, o que é e.target.value?", "o": ["O nome do componente", "O texto atual digitado no input", "O id do input", "A cor do input"], "a": 1, "e": ["Não representa o nome do componente.", "Correto. e é o evento, target é o input e value é o que está escrito nele.", "O id seria e.target.id.", "Cor não tem relação."], "g": "React", "d": ["No onChange o React entrega um evento (e). e.target é o input e .value é o texto que está nele naquele momento.", "<input onChange={(e) => setNome(e.target.value)} />"]}, {"c": "React — Inputs", "q": "Por que a Calculadora converte os valores com Number(numero1) antes de calcular?", "o": ["Porque o valor de um input vem como texto (string), e \"2\" + \"3\" daria \"23\"", "Porque React exige Number em todo cálculo", "Para deixar o input mais bonito", "Porque Number impede valores vazios"], "a": 0, "e": ["Correto. Sem conversão, o + concatenaria os textos em vez de somar.", "React não exige isso; é uma característica dos inputs.", "Não tem efeito visual.", "A validação de vazio é feita separadamente."], "g": "React", "d": ["O valor de um input vem sempre como texto. Somar textos junta as palavras; por isso convertemos com Number antes de calcular.", "\"2\" + \"3\"           // \"23\"\nNumber(\"2\") + Number(\"3\") // 5"]}, ": ["Definir a ordem visual do item dentro do container", "Ordenar o HTML automaticamente", "Ordenar itens por tamanho", "Criar uma lista numerada"], "a": 0, "e": ["Correto. Itens com order menor aparecem primeiro; o padrão é 0.", "O HTML continua igual; muda só a exibição.", "Não ordena por tamanho.", "Listas numeradas usam <ol>."], "g": "Flexbox e CSS", "d": ["order muda a posição visual sem mexer no HTML. Menor número aparece primeiro; o padrão é 0.", ".a { order: 2; }\n.b { order: 1; } /* b aparece antes de a */"]}, {"c": "Flexbox", "q": "Um item de um flex container pode também ser um flex container?", "o": ["Não, é proibido", "Sim, basta aplicar display: flex nele também (flex aninhado)", "Só se for uma imagem", "Só com JavaScript"], "a": 1, "e": ["É totalmente permitido.", "Correto. Isso é comum em layouts: um card flex dentro de uma linha flex.", "Imagens não são o caso comum.", "É só CSS."], "g": "Flexbox e CSS", "d": ["Flex aninhado é comum: um elemento pode ser item de um container e, ao mesmo tempo, container dos seus próprios filhos.", ".linha { display: flex; }\n.card  { display: flex; flex-direction: column; }"]}, {"c": "Flexbox", "q": "Como deixar o rodapé sempre no fim da página, mesmo com pouco conteúdo?", "o": ["body com display: flex, flex-direction: column, min-height: 100vh e o main com flex: 1", "Colocar o footer dentro do header", "Usar text-align: bottom", "Não é possível"], "a": 0, "e": ["Correto. O main cresce e empurra o footer para baixo.", "Isso não resolve.", "text-align não existe com esse valor para isso.", "É possível e é uma técnica clássica de Flexbox."], "g": "Flexbox e CSS", "d": ["Truque clássico: o body vira coluna com altura mínima da tela, e o main com flex: 1 cresce para ocupar o espaço, empurrando o footer para baixo.", "body {\n  display: flex;\n  flex-direction: column;\n  min-height: 100vh;\n}\nmain { flex: 1; }"]}, {"c": "Flexbox", "q": "Como deixar três cards lado a lado com 16px entre eles?", "o": ["No pai: display: flex; gap: 16px;", "Em cada card: display: flex; gap: 16px;", "No pai: flex-direction: column; gap: 16px;", "No pai: gap: 16px; sem display: flex"], "a": 0, "e": ["Correto. O pai vira container, e gap cria o espaço entre os filhos.", "O container precisa ser o pai, não os cards.", "column deixaria os cards um embaixo do outro.", "Sem display flex (ou grid), o gap não tem efeito em um bloco comum."], "g": "Flexbox e CSS", "d": ["O flex vai no pai dos cards, e o gap dá o espaço entre eles. Em row (padrão), ficam lado a lado.", ".cards {\n  display: flex;\n  gap: 16px;\n}"]}, {"c": "JavaScript", "q": "Qual é a diferença entre == e === em JavaScript?", "o": ["Nenhuma", "=== compara valor e tipo; == converte tipos antes de comparar", "== é mais seguro que ===", "=== só funciona com números"], "a": 1, "e": ["Existe diferença importante.", "Correto. Por isso \"5\" == 5 é true, mas \"5\" === 5 é false.", "O mais seguro e recomendado é ===.", "Funciona com qualquer tipo."], "g": "JavaScript e calculadora", "d": ["=== compara valor E tipo, sem conversões surpresa. == tenta converter os tipos antes. Prefira sempre ===.", "5 == \"5\"   // true\n5 === \"5\"  // false"]}, {"c": "JavaScript", "q": "Como ler o valor \"soma\" do objeto const contas = { soma: 5, divisao: 2 }?", "o": ["contas.soma", "contas(soma)", "contas->soma", "soma.contas"], "a": 0, "e": ["Correto. Também funciona contas[\"soma\"].", "Parênteses são para chamar funções.", "-> não existe em JavaScript.", "A ordem está invertida."], "g": "JavaScript e calculadora", "d": ["Objetos guardam pares nome:valor. Você lê com ponto (objeto.nome) ou com colchetes (objeto[\"nome\"]).", "const contas = { soma: 5, divisao: 2 };\nconsole.log(contas.soma); // 5"]}, {"c": "JavaScript", "q": "O que faz a template string `Olá, ${nome}!`?", "o": ["Mostra literalmente ${nome}", "Insere o valor da variável nome dentro do texto", "Cria um comentário", "Cria uma função"], "a": 1, "e": ["Isso aconteceria com aspas simples ou duplas.", "Co let list = questions, current = 0, score = 0, answered = false, wrongList = [];
const $ = id => document.getElementById(id);

// ===== Erros salvos no navegador (localStorage) =====
const STORE = 'quizErrosSalvos_v1';
let errors = {};
try { errors = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch(e) { errors = {}; }
function saveErrors(){ try { localStorage.setItem(STORE, JSON.stringify(errors)); } catch(e) {} refreshSaved(); }
function savedCount(){ return questions.filter(x => errors[x.q]).length; }
function clearSaved(){
  if(!savedCount() || !confirm('Apagar todos os erros salvos?')) return;
  errors = {}; saveErrors();
  if($('filter').value === '__saved') startFromFilter();
}
function refreshSaved(){
  $('savedInfo').textContent = '🗂️ Erros salvos: ' + savedCount();
  const f = $('filter'), cur = f.value || '__all';
  const groups = [...new Set(questions.map(x => x.g))];
  f.innerHTML = '<option value="__all">Todos os temas (' + questions.length + ')</option>'
    + '<option value="__saved">⭐ Meus erros salvos (' + savedCount() + ')</option>'
    + groups.map(g => '<option value="' + g + '">' + g + ' (' + questions.filter(x => x.g === g).length + ')</option>').join('');
  f.value = cur;
}
$('total').textContent = questions.length;

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startFromFilter(){
  const g=$('filter').value;
  startRound(g==='__all' ? questions : g==='__saved' ? questions.filter(x=>errors[x.q]) : questions.filter(x=>x.g===g));
}
function startRound(l){
  list = l.slice();
  if($('shuffle').checked) shuffleArr(list); current = 0; score = 0; wrongList = [];
  $('result').classList.remove('show');
  if(!list.length){
    $('quiz').innerHTML = '<article class="question-card"><h2 class="question">Nenhum erro salvo por aqui 🎉</h2><p style="color:var(--muted)">Quando você errar uma questão, ela fica guardada neste navegador e aparece aqui. Ao acertá-la depois, ela sai da lista.</p></article>';
    $('progressText').textContent = '—'; $('progressFill').style.width = '0%';
    return;
  }
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuestion(){
  answered = false;
  const q = list[current], letters = ['A','B','C','D'];
  $('progressText').textContent = `Questão ${current+1} de ${list.length}`;
  $('progressFill').style.width = `${current/list.length*100}%`;
  $('scoreText').textContent = `Acertos: ${score}`;

  $('quiz').innerHTML = `
    <article class="question-card">
      <span class="category"></span>
      <h2 class="question"></h2>
      <div class="answers">
        ${q.o.map((_, i) => `
          <button type="button" class="answer" data-index="${i}">
            <span class="letter">${letters[i]}</span>
            <span class="answer-text">
              <strong class="label"></strong>
              <span class="explanation"><strong>Por quê?</strong> <span class="exp"></span></span>
              <span class="understand" role="button" tabindex="0">💡 Entender</span>
            </span>
            <span class="status"></span>
          </button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button type="button" class="action secondary" id="nextBtn" disabled>
          ${current === list.length-1 ? 'Ver resultado' : 'Próxima questão →'}
        </button>
      </div>
    </article>`;

  const card = $('quiz');
  card.querySelector('.category').textContent = q.c + (errors[q.q] ? ' · ❗ já errada ' + errors[q.q] + '×' : '');
  card.querySelector('.question').textContent = q.q;
  card.querySelectorAll('.answer').forEach((b,i) => {
    b.querySelector('.label').textContent = q.o[i];
    b.querySelector('.exp').textContent = q.e[i];
  });

  card.querySelector('.answers').onclick = ev => {
    const u = ev.target.closest('.understand');
    if(u){ ev.stopPropagation(); if(answered) openModal(Number(u.closest('.answer').dataset.index)); return; }
    const b = ev.target.closest('.answer');
    if(!b || answered) return;
    choose(Number(b.dataset.index));
  };
  $('nextBtn').onclick = next;
}

function choose(sel){
  answered = true;
  const q = list[current], fb = $('feedback');
  document.querySelectorAll('.answer').forEach((b,i) => {
    b.classList.add('disabled','show-explanation', i === q.a ? 'correct' : 'wrong');
    b.querySelector('.status').textContent = i === q.a ? '✓ CERTA' : '✗ ERRADA';
  });
  if(sel === q.a){
    score++;
    fb.className = 'feedback show good';
    fb.textContent = '🎉 Você acertou! Leia também por que as outras estão erradas.';
    if(errors[q.q]){ delete errors[q.q]; saveErrors(); fb.textContent += ' Ela saiu da sua lista de erros salvos. ✅'; }
  } else {
    wrongList.push(q);
    errors[q.q] = (errors[q.q] || 0) + 1; saveErrors();
    fb.className = 'feedback show bad';
    fb.textContent = '❌ Você errou. A correta está em verde; leia as explicações. Ela foi salva na sua lista de erros.';
  }
  $('scoreText').textContent = `Acertos: ${score}`;
  const n = $('nextBtn'); n.disabled = false; n.classList.remove('secondary');
}

function openModal(i){
  const q = list[current], ok = i === q.a;
  const box = $('modalBox');
  box.innerHTML = `<span class="badge ${ok?'ok':'no'}">${ok?'✓ Alternativa CERTA':'✗ Alternativa ERRADA'}</span>
    <h3></h3>
    <div class="lbl">Por quê?</div><p class="m-why"></p>
    <div class="lbl">Explicando melhor</div><p class="m-deep"></p>
    <pre></pre>
    <div style="text-align:right;margin-top:14px"><button class="action" onclick="closeModal()">Entendi</button></div>`;
  box.querySelector('h3').textContent = ['A','B','C','D'][i] + ') ' + q.o[i];
  box.querySelector('.m-why').textContent = q.e[i];
  box.querySelector('.m-deep').textContent = q.d[0];
  box.querySelector('pre').textContent = q.d[1];
  $('modal').classList.add('show');
}
function closeModal(){ $('modal').classList.remove('show'); }
$('modal').onclick = e => { if(e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function next(){
  if(!answered) return;
  if(current < list.length-1){ current++; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
  else showResult();
}

function showResult(){
  $('quiz').innerHTML = '';
  $('result').classList.add('show');
  $('progressText').textContent = 'Rodada concluída';
  $('progressFill').style.width = '100%';
  $('finalScore').textContent = `${score}/${list.length}`;
  const p = Math.round(score/list.length*100);
  $('finalMessage').textContent = p >= 90 ? `Você acertou ${p}%. Excelente, é só manter a prática!`
    : p >= 70 ? `Você acertou ${p}%. Boa base; refaça as que errou para fechar as lacunas.`
    : `Você acertou ${p}%. Refaça só as que errou e leia bem as explicações.`;
  $('retryWrong').style.display = wrongList.length ? 'inline-block' : 'none';
  window.scrollTo({top:0,behavior:'smooth'});
}

refreshSaved();
$('filter').onchange=startFromFilter;
$('shuffle').onchange=startFromFilter;
startFromFilter();
</script>
